<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2196F3">
</head>
<body>
  <main class="calculator">
    <input class="display" type="text" value="0" readonly aria-label="Calculator display" />

    <div class="keys">
      <button class="btn action" data-action="clear">C</button>
      <button class="btn action" data-action="plus-minus">±</button>
      <button class="btn action" data-action="percent">%</button>
      <button class="btn operator" data-value="÷">÷</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" data-value="×">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn operator" data-value="-">−</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn operator" data-value="+">+</button>

      <button class="btn wide" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn action" data-action="delete">⌫</button>
      <button class="btn equals" data-action="equals">=</button>

</div> <!-- keys close -->

</div> <!-- calculator close -->


<footer class="founder-footer">
    <p>Founded by <span class="hariom">HARIOM NARAYAN</span></p>
    <p>Co-Founder <span class="adarsh">ADARSH NARAYAN</span></p>
</footer>


<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
